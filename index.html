<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Математика и Сюрприз</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #f0f8ff;
        }

        /* Контейнер с примером */
        #quiz-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            transition: opacity 0.5s ease;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 50px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        input {
            font-size: 28px;
            padding: 10px;
            width: 100px;
            text-align: center;
            border: 3px solid #ccc;
            border-radius: 10px;
            outline: none;
        }

        input:focus {
            border-color: #7b68ee;
        }

        button {
            font-size: 28px;
            padding: 10px 25px;
            margin-top: 20px;
            background-color: #7b68ee;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #5a4fcf;
        }

        #error-message {
            color: red;
            font-size: 20px;
            margin-top: 20px;
            height: 25px;
            font-weight: bold;
            text-align: center;
        }

        /* --- ИСПРАВЛЕННЫЕ СТИЛИ ДЛЯ КАРТИНКИ --- */
        #surprise-image {
            display: none;
            position: fixed;
            top: 50%;             /* Центрируем по вертикали */
            left: 50%;            /* Центрируем по горизонтали */
            transform: translate(-50%, -50%); /* Точное центрирование */
            max-width: 100vw;     /* Картинка не шире экрана */
            max-height: 100vh;    /* Картинка не выше экрана */
            width: auto;          /* Сохраняем пропорции */
            height: auto;         /* Сохраняем пропорции */
            object-fit: contain;  /* Вписываем картинку целиком */
            z-index: 9999;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="quiz-container">
        <h1>1 + 1 = ?</h1>
        
        <input type="number" id="answerInput" placeholder="?">
        <button onclick="checkAnswer()">Ответить</button>

        <div id="error-message"></div>
    </div>

    <!-- ВАША КАРТИНКА -->
    <img id="surprise-image" src="kartinka.png" alt="Сюрприз">

    <script>
        function checkAnswer() {
            const userAnswer = document.getElementById('answerInput').value;
            const quizContainer = document.getElementById('quiz-container');
            const image = document.getElementById('surprise-image');
            const errorMsg = document.getElementById('error-message');

            if (userAnswer == 2) {
                quizContainer.classList.add('hidden');
                
                setTimeout(() => {
                    image.style.display = 'block';
                }, 400); 
                
            } else {
                errorMsg.textContent = 'Неправильно! Попробуй еще раз.';
            }
        }

        document.getElementById('answerInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });
    </script>

</body>
</html>
