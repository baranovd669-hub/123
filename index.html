<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f8ff; /* Светло-голубой фон */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 90%;
        }

        h1 {
            font-size: 48px;
            color: #333;
            margin-bottom: 20px;
        }

        input {
            font-size: 24px;
            padding: 10px;
            width: 100px;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 10px;
            outline: none;
        }

        input:focus {
            border-color: #7b68ee;
        }

        button {
            font-size: 24px;
            padding: 10px 20px;
            margin-left: 10px;
            background-color: #7b68ee;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #5a4fcf;
        }

        #error-message {
            color: red;
            font-size: 18px;
            margin-top: 15px;
            height: 20px;
        }

        /* Стили для картинки */
        #surprise-image {
            display: none; /* Изначально скрыта */
            max-width: 100%;
            height: auto;
            margin-top: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Анимация появления */
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>1 + 1 = ?</h1>
        
        <div>
            <input type="number" id="answerInput" placeholder="?">
            <button onclick="checkAnswer()">Ответить</button>
        </div>

        <div id="error-message"></div>

        <!-- ЗДЕСЬ ВАША КАРТИНКА. Замените image.jpg на название вашего файла -->
        <img id="surprise-image" src="kartinka.png" alt="Моя картинка">
    </div>

    <script>
        function checkAnswer() {
            // Получаем то, что ввел пользователь
            const userAnswer = document.getElementById('answerInput').value;
            const image = document.getElementById('surprise-image');
            const errorMsg = document.getElementById('error-message');

            // Проверяем, равно ли это 2
            if (userAnswer == 2) {
                // Если да - показываем картинку и убираем ошибку
                image.style.display = 'block';
                errorMsg.textContent = '';
            } else {
                // Если нет - пишем ошибку и прячем картинку
                errorMsg.textContent = 'Неправильно! Попробуй еще раз.';
                image.style.display = 'none';
            }
        }

        // Бонус: проверка по нажатию клавиши Enter
        document.getElementById('answerInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });
    </script>

</body>
</html>
