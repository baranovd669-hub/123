<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            font-family: 'Arial', sans-serif;
            background-color: #f0f8ff;
        }

       
        #quiz-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            transition: opacity 0.5s ease; 
        }

        h1 {
            font-size: 60px;
            color: #333;
            margin-bottom: 20px;
        }

        input {
            font-size: 30px;
            padding: 10px;
            width: 120px;
            text-align: center;
            border: 3px solid #ccc;
            border-radius: 10px;
            outline: none;
        }

        input:focus {
            border-color: #7b68ee;
        }

        button {
            font-size: 30px;
            padding: 10px 25px;
            margin-top: 20px;
            background-color: #7b68ee;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #5a4fcf;
        }

        #error-message {
            color: red;
            font-size: 22px;
            margin-top: 20px;
            height: 25px;
            font-weight: bold;
        }

       
        #surprise-image {
            display: none; 
            position: fixed; 
            top: 0;
            left: 0;
            width: 100vw;  
            height: 100vh; 
            object-fit: cover;
            z-index: 9999; 
        }

      
        .hidden {
            opacity: 0;
            pointer-events: none; 
        }
    </style>
</head>
<body>

 
    <div id="quiz-container">
        <h1>1 + 1 = ?</h1>
        
        <input type="number" id="answerInput" placeholder="?">
        <button onclick="checkAnswer()">Ответить</button>

        <div id="error-message"></div>
    </div>


    <img id="surprise-image" src="kartinka.png" alt="Сюрприз">

    <script>
        function checkAnswer() {
            const userAnswer = document.getElementById('answerInput').value;
            const quizContainer = document.getElementById('quiz-container');
            const image = document.getElementById('surprise-image');
            const errorMsg = document.getElementById('error-message');

            // Проверяем правильный ли ответ
            if (userAnswer == 2) {
                // 1. Скрываем блок с примером (плавно)
                quizContainer.classList.add('hidden');
                
                // 2. Ждем полсекунды (пока пример исчезает), затем показываем картинку
                setTimeout(() => {
                    image.style.display = 'block';
                }, 400); 
                
            } else {
                // Если ответ неверный
                errorMsg.textContent = 'Неправильно! Попробуй еще раз.';
            }
        }

        // Проверка по нажатию клавиши Enter
        document.getElementById('answerInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });
    </script>

</body>
</html>
